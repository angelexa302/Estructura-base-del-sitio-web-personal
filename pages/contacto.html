    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark encabezado">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <img src="../assets/sobreMi.png" alt="logo de mi marca" class="logo-img">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPrincipal" aria-controls="navbarPrincipal" aria-expanded="false" aria-label="Alternar navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarPrincipal">
                    <ul class="navbar-nav ms-auto lista-nav">
                        <li class="nav-item"><a href="../index.html" class="nav-link enlace-nav">Inicio</a></li>
                        <li class="nav-item"><a href="sobreMi.html" class="nav-link enlace-nav">Sobre mi</a></li>
                        <li class="nav-item"><a href="proyectos.html" class="nav-link enlace-nav">Proyectos</a></li>

                        <li class="nav-item"><a href="habilidades.html" class="nav-link enlace-nav">Habilidades</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="contenedor">
        <section>
            <h1 class="titulo-principal">Contacto</h1>
            <p class="texto-parrafo">
                Si deseas comunicarte conmigo para consultas, propuestas de trabajo o proyectos,
                puedes hacerlo a través del siguiente formulario.
            </p>

            <form action="#" method="post" class="formulario-contacto">
                <div class="campo-formulario">
                    <label for="nombre" class="etiqueta-formulario form-label">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required class="form-control entrada-formulario">
                </div>

                <div class="campo-formulario">
                    <label for="correo" class="etiqueta-formulario form-label">Correo:</label>
                    <input type="email" id="correo" name="correo" required class="form-control entrada-formulario">
                </div>

                <div class="campo-formulario">
                    <label for="mensaje" class="etiqueta-formulario form-label">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required class="form-control area-texto-formulario"></textarea>
                </div>

                <button type="submit" class="btn boton">Enviar</button>
            </form>
        </section>
    </main>
    <footer class="pie-pagina">
        <p>&copy; Todos los derechos reservados 2026 - JoseLuis.</p>

            <li><a href="#" class="enlace-red">GitHub</a></li>
