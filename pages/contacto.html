<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <header class="encabezado">
        <img src="../assets/sobreMi.png" alt="logo de mi marca" class="logo-img">
        <nav>
            <ul class="lista-nav">
                <li><a href="../index.html" class="enlace-nav">Inicio</a></li>
                <li><a href="sobreMi.html" class="enlace-nav">Sobre mi</a></li>
                <li><a href="proyectos.html" class="enlace-nav">Proyectos</a></li>
                <li><a href="contacto.html" class="enlace-nav">Contacto</a></li>
                <li><a href="habilidades.html" class="enlace-nav">Habilidades</a></li>
            </ul>
        </nav>
    </header>
    <main class="contenedor">
        <section>
            <h1 class="titulo-principal">Contacto</h1>
            <p class="texto-parrafo">
                Si deseas comunicarte conmigo para consultas, propuestas de trabajo o proyectos,
                puedes hacerlo a través del siguiente formulario.
            </p>

            <form action="#" method="post" class="formulario-contacto">
                <div class="campo-formulario">
                    <label for="nombre" class="etiqueta-formulario">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required class="entrada-formulario">
                </div>

                <div class="campo-formulario">
                    <label for="correo" class="etiqueta-formulario">Correo:</label>
                    <input type="email" id="correo" name="correo" required class="entrada-formulario">
                </div>

                <div class="campo-formulario">
                    <label for="mensaje" class="etiqueta-formulario">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required class="area-texto-formulario"></textarea>
                </div>

                <button type="submit" class="boton">Enviar</button>
            </form>
        </section>
    </main>
    <footer class="pie-pagina">
        <p>&copy; Todos los derechos reservados 2026 - JoseLuis.</p>

            <li><a href="#" class="enlace-red">GitHub</a></li>

            <li><a href="#" class="enlace-red">Instagram</a></li>
        </ul>
    </footer>
</body>
</html>
